<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>108足梵音 圓形圖表 v5</title>
<style>
  :root{--bg:#0d1117;--panel:#161b22;--line:#30363d;--txt:#e6edf3;--sub:#8b949e;}
  *{box-sizing:border-box;}
  body{
    margin:0;min-height:100vh;
    background:radial-gradient(circle at 50% 32%,#1a2233 0%,#0d1117 72%);
    color:var(--txt);
    font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",system-ui,sans-serif;
    display:flex;flex-direction:column;align-items:center;padding:26px 12px 60px;
  }
  h1{font-size:1.5rem;font-weight:700;margin:0 0 4px;letter-spacing:.1em;}
  .subtitle{color:var(--sub);font-size:.82rem;margin-bottom:16px;letter-spacing:.05em;text-align:center;}

  .stage{position:relative;width:min(96vw,960px);aspect-ratio:1/1;}

  .center-info{
    position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);
    width:30%;aspect-ratio:1/1;border-radius:50%;
    background:var(--panel);border:1px solid var(--line);
    display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;
    padding:4%;transition:background .25s;box-shadow:0 0 50px rgba(0,0,0,.7) inset;z-index:5;
  }
  .center-info .c-idx{font-size:.64rem;color:var(--sub);letter-spacing:.2em;margin-bottom:.15em;}
  .center-info .c-star{font-size:clamp(.95rem,3.3vw,1.4rem);font-weight:800;color:#ffdf8a;line-height:1.1;}
  .center-info .c-in{font-size:.68rem;color:var(--sub);margin-top:.15em;}
  .center-info .c-planet{font-size:clamp(.78rem,2.4vw,1rem);margin-top:.4em;font-weight:600;}
  .center-info .c-planet .s{font-size:1.55em;vertical-align:-.12em;}
  .center-info .c-feet{margin-top:.55em;font-size:clamp(.66rem,1.95vw,.88rem);line-height:1.85;font-family:"SF Mono",Consolas,monospace;}
  .center-info .c-feet .f{color:#a8c4e6;font-weight:700;}
  .center-info .c-feet .k{color:#e0bd96;}
  .center-info .hint{font-size:.6rem;color:var(--sub);margin-top:.8em;opacity:.75;}

  .ring{width:100%;height:100%;overflow:visible;}
  .cell{cursor:pointer;transition:opacity .2s;}
  .cell:hover path{filter:brightness(1.55) saturate(1.2);}
  .cell.dim{opacity:.16;}

  .lbl{pointer-events:none;transition:font-size .18s, fill .18s;}
  .fan-txt{font-family:"SF Mono",Consolas,monospace;font-weight:700;}
  .kana-txt{font-weight:700;}

  .legend{display:flex;flex-wrap:wrap;gap:6px 14px;justify-content:center;max-width:840px;margin-top:20px;}
  .legend-item{display:flex;align-items:center;gap:6px;font-size:.76rem;color:#c9d1d9;}
  .dot{width:12px;height:12px;border-radius:3px;flex:none;}
  footer{margin-top:20px;font-size:.68rem;color:var(--sub);text-align:center;max-width:820px;line-height:1.75;}
</style>
</head>
<body>

<h1>108足梵音 圓形圖表</h1>
<div class="subtitle">27宿 × 4足 = 108 足 · 九曜輪值｜內圈＝片假名，外圈＝梵音英語拼音</div>

<div class="stage">
  <svg class="ring" viewBox="0 0 800 800" id="ring"></svg>
  <div class="center-info" id="info">
    <div class="c-idx">NO. --</div>
    <div class="c-star">27 宿</div>
    <div class="c-in">滑鼠移到任一格</div>
    <div class="hint">顯示該宿四足</div>
  </div>
</div>

<div class="legend" id="legend"></div>

<footer>
  星序：計都 ☋ → 金星 ♀ → 太陽 ☉ → 月亮 ☽ → 火星 ♂ → 羅睺 ☊ → 木星 ♃ → 土星 ♄ → 水星 ☿（每曜輪值 3 宿）<br>
  <b>第二圈＝片假名（如 チュ・チェ）｜最外圈色帶＝梵音英語拼音（如 Chu・Che）；兩者皆水平正放。</b>
</footer>

<script>
/* ===================== 資料區（依你提供的 108 足） ===================== */
const PLANETS = {
  "計都":{sym:"☋", color:"#8b6fb0"},
  "金星":{sym:"♀", color:"#d4a5c9"},
  "太陽":{sym:"☉", color:"#e8b84b"},
  "月亮":{sym:"☽", color:"#c5cbd6"},
  "火星":{sym:"♂", color:"#d9564a"},
  "羅睺":{sym:"☊", color:"#4a9c86"},
  "木星":{sym:"♃", color:"#c9a227"},
  "土星":{sym:"♄", color:"#9a8f7a"},
  "水星":{sym:"☿", color:"#4b9ed6"}
};

const STARS = [
  {cn:"婁", in:"Aswini",            planet:"計都", feet:["Chu","Che","Cho","La"],   kana:["チュ","チェ","チョ","ラ"]},
  {cn:"胃", in:"Bharani",           planet:"金星", feet:["Li","Lu","Le","Lo"],     kana:["リ","ル","レ","ロ"]},
  {cn:"昴", in:"Krittika",          planet:"太陽", feet:["A","I","U","E"],         kana:["ア","イ","ウ","エ"]},
  {cn:"畢", in:"Rohini",            planet:"月亮", feet:["O","Va","Vi","Vu"],     kana:["オ","ヴァ","ヴィ","ヴ"]},
  {cn:"觜", in:"Mrigashira",        planet:"火星", feet:["Ve","Vo","Ka","Ki"],    kana:["ヴェ","ヴォ","カ","キ"]},
  {cn:"參", in:"Ardra",             planet:"羅睺", feet:["Ku","Gha","Ng","Chha"], kana:["ク","ガー","ン","チャー"]},
  {cn:"井", in:"Punarvasu",         planet:"木星", feet:["Ke","Ko","Ha","Hi"],    kana:["ケ","コ","ハ","ヒ"]},
  {cn:"鬼", in:"Pushya",            planet:"土星", feet:["Hu","He","Ho","Da"],    kana:["フ","ヘ","ホ","ダ"]},
  {cn:"柳", in:"Ashlesha",          planet:"水星", feet:["Di","Du","De","Do"],    kana:["ディ","ドゥ","デ","ド"]},
  {cn:"星", in:"Magha",             planet:"計都", feet:["Ma","Mi","Mu","Me"],    kana:["マ","ミ","ム","メ"]},
  {cn:"張", in:"Purva Phalguni",    planet:"金星", feet:["Mo","Ta","Ti","Tu"],    kana:["モ","タ","ティ","トゥ"]},
  {cn:"翼", in:"Uttara Phalguni",   planet:"太陽", feet:["Te","To","Pa","Pi"],    kana:["テ","ト","パ","ピ"]},
  {cn:"軫", in:"Hasta",             planet:"月亮", feet:["Pu","Sha","Na","Tha"],  kana:["プ","シャ","ナ","タ"]},
  {cn:"角", in:"Chitra",            planet:"火星", feet:["Pe","Po","Ra","Ri"],    kana:["ペ","ポ","ラ","リ"]},
  {cn:"亢", in:"Swati",             planet:"羅睺", feet:["Ru","Re","Ro","Ta"],    kana:["ル","レ","ロ","タ"]},
  {cn:"氐", in:"Vishakha",          planet:"木星", feet:["Ti","Tu","Te","To"],    kana:["ティ","トゥ","テ","ト"]},
  {cn:"房", in:"Anuradha",          planet:"土星", feet:["Na","Ni","Nu","Ne"],    kana:["ナ","ニ","ヌ","ネ"]},
  {cn:"心", in:"Jyeshta",           planet:"水星", feet:["No","Ya","Yi","Yu"],    kana:["ノ","ヤ","イ","ユ"]},
  {cn:"尾", in:"Mula",              planet:"計都", feet:["Ye","Yo","Bha","Bhi"],  kana:["エ","ヨ","バ","ビ"]},
  {cn:"箕", in:"Purva Ashadha",     planet:"金星", feet:["Bhu","Dha","Pha","Dha"],kana:["ブ","ダ","ファ","ダ"]},
  {cn:"斗", in:"Uttara Ashadha",    planet:"太陽", feet:["Bhe","Bho","Ja","Ji"],  kana:["ベ","ボ","ジャ","ジ"]},
  {cn:"女", in:"Shravana",          planet:"月亮", feet:["Ju","Je","Jo","Gha"],   kana:["ジュ","ジェ","ジョ","ガ"]},
  {cn:"虛", in:"Dhanishta",         planet:"火星", feet:["Ga","Gi","Gu","Ge"],    kana:["ガ","ギ","グ","ゲ"]},
  {cn:"危", in:"Shatabhisha",       planet:"羅睺", feet:["Go","Sa","Si","Su"],    kana:["ゴ","サ","シ","ス"]},
  {cn:"室", in:"Purva Bhadrapada",  planet:"木星", feet:["Se","So","Da","Di"],    kana:["セ","ソ","ダ","ディ"]},
  {cn:"壁", in:"Uttara Bhadrapada", planet:"土星", feet:["Du","Tha","Jham","Jna"],kana:["ドゥ","サ","ニャ","ニャ"]},
  {cn:"奎", in:"Revati",            planet:"水星", feet:["De","Do","Cha","Chi"],  kana:["デ","ド","チャ","チ"]}
];

/* ===================== 繪圖程式 ===================== */
const svg=document.getElementById("ring");
const NS="http://www.w3.org/2000/svg";
const CX=400,CY=400;
const N_STAR=STARS.length, N_FOOT=4, N_CELL=N_STAR*N_FOOT;
const step=(2*Math.PI)/N_CELL;
const START=-Math.PI/2 - step/2;

const R_IN=150, R_OUT=356;
const R_INNER_BAND_IN = R_IN;          // 第二圈（片假名）範圍
const R_INNER_BAND_OUT = 250;
const R_OUTER_BAND_IN  = 300;          // 最外圈色帶（梵音拼音）範圍
const R_OUTER_BAND_OUT = R_OUT;
const R_NAME=R_OUT+40;

function pt(r,a){return [CX+r*Math.cos(a), CY+r*Math.sin(a)];}
function wedge(a0,a1,rIn,rOut){
  const [x0,y0]=pt(rOut,a0),[x1,y1]=pt(rOut,a1);
  const [x2,y2]=pt(rIn,a1),[x3,y3]=pt(rIn,a0);
  const large=(a1-a0)>Math.PI?1:0;
  return `M ${x0} ${y0} A ${rOut} ${rOut} 0 ${large} 1 ${x1} ${y1}
          L ${x2} ${y2} A ${rIn} ${rIn} 0 ${large} 0 ${x3} ${y3} Z`;
}
/* 宿名用：圓下方翻正 */
function orientUpright(midDeg){
  let rot=midDeg+90;
  if(midDeg>90 && midDeg<270) rot+=180;
  return rot;
}

const cells=[];
const kanaTexts=[];   // 第二圈（片假名）
const fanTexts=[];    // 最外圈（梵音拼音）

for(let s=0;s<N_STAR;s++){
  const st=STARS[s], pl=PLANETS[st.planet];
  for(let f=0;f<N_FOOT;f++){
    const gi=s*N_FOOT+f;
    const a0=START+gi*step, a1=a0+step, mid=a0+step/2;
    const midDeg=mid*180/Math.PI;

    const g=document.createElementNS(NS,"g");
    g.setAttribute("class","cell");
    g.dataset.i=gi; g.dataset.s=s; g.dataset.f=f;

    /* 整體格底（淡） */
    const p=document.createElementNS(NS,"path");
    p.setAttribute("d",wedge(a0+0.001,a1-0.001,R_IN,R_OUT));
    p.setAttribute("fill",pl.color);
    p.setAttribute("fill-opacity","0.16");
    p.setAttribute("stroke","#0d1117");
    p.setAttribute("stroke-width","0.7");
    g.appendChild(p);

    /* ★ 第二圈：片假名帶（實色底，深字） */
    const pb2=document.createElementNS(NS,"path");
    pb2.setAttribute("d",wedge(a0+0.001,a1-0.001,R_INNER_BAND_IN,R_INNER_BAND_OUT));
    pb2.setAttribute("fill",pl.color);
    pb2.setAttribute("fill-opacity","0.85");
    pb2.setAttribute("stroke","#0d1117");
    pb2.setAttribute("stroke-width","0.6");
    g.appendChild(pb2);

    /* 中間空白腰帶（分隔兩圈） */
    const pmid=document.createElementNS(NS,"path");
    pmid.setAttribute("d",wedge(a0+0.001,a1-0.001,R_INNER_BAND_OUT,R_OUTER_BAND_IN));
    pmid.setAttribute("fill","#0f151d");
    pmid.setAttribute("stroke","#0d1117");
    pmid.setAttribute("stroke-width","0.5");
    g.appendChild(pmid);

    /* ★ 最外圈：梵音英語拼音色帶（實色底，亮字） */
    const pb3=document.createElementNS(NS,"path");
    pb3.setAttribute("d",wedge(a0+0.001,a1-0.001,R_OUTER_BAND_IN,R_OUTER_BAND_OUT));
    pb3.setAttribute("fill",pl.color);
    pb3.setAttribute("fill-opacity","0.85");
    pb3.setAttribute("stroke","#0d1117");
    pb3.setAttribute("stroke-width","0.6");
    g.appendChild(pb3);

    svg.appendChild(g);
    cells.push(g);

    /* ── 第二圈文字：片假名（水平正放、不旋轉） ── */
    const [kx,ky]=pt((R_INNER_BAND_IN+R_INNER_BAND_OUT)/2, mid);
    const tKana=document.createElementNS(NS,"text");
    tKana.setAttribute("class","lbl kana-txt");
    tKana.setAttribute("x",kx); tKana.setAttribute("y",ky);
    tKana.setAttribute("font-size","12.5");
    tKana.setAttribute("fill","#0d1117");
    tKana.setAttribute("text-anchor","middle");
    tKana.setAttribute("dominant-baseline","middle");
    tKana.textContent=st.kana[f];
    svg.appendChild(tKana);
    kanaTexts.push({el:tKana, base:12.5, s:s});

    /* ── 最外圈文字：梵音英語拼音（水平正放、不旋轉） ── */
    const [fx,fy]=pt((R_OUTER_BAND_IN+R_OUTER_BAND_OUT)/2, mid);
    const tFan=document.createElementNS(NS,"text");
    tFan.setAttribute("class","lbl fan-txt");
    tFan.setAttribute("x",fx); tFan.setAttribute("y",fy);
    tFan.setAttribute("font-size","12.5");
    tFan.setAttribute("fill","#ffffff");
    tFan.setAttribute("text-anchor","middle");
    tFan.setAttribute("dominant-baseline","middle");
    tFan.textContent=st.feet[f];
    svg.appendChild(tFan);
    fanTexts.push({el:tFan, base:12.5, s:s});
  }
}

/* 宿名、分界線、九曜符號 */
for(let s=0;s<N_STAR;s++){
  const st=STARS[s], pl=PLANETS[st.planet];
  const a=START+s*N_FOOT*step;
  const [x1,y1]=pt(R_IN,a),[x2,y2]=pt(R_OUT+20,a);
  const ln=document.createElementNS(NS,"line");
  ln.setAttribute("x1",x1);ln.setAttribute("y1",y1);
  ln.setAttribute("x2",x2);ln.setAttribute("y2",y2);
  ln.setAttribute("stroke","#0d1117");ln.setAttribute("stroke-width","1.7");
  svg.appendChild(ln);

  const mid=START+(s*N_FOOT+2)*step;
  const midDeg=mid*180/Math.PI;

  const [tx,ty]=pt(R_NAME,mid);
  const t=document.createElementNS(NS,"text");
  t.setAttribute("class","lbl");
  t.setAttribute("x",tx); t.setAttribute("y",ty);
  t.setAttribute("font-size","18");
  t.setAttribute("font-weight","800");
  t.setAttribute("fill","#ffdf8a");
  t.setAttribute("text-anchor","middle");
  t.setAttribute("dominant-baseline","middle");
  t.setAttribute("transform",`rotate(${orientUpright(midDeg)} ${tx} ${ty})`);
  t.textContent=st.cn;
  svg.appendChild(t);

  const [sx,sy]=pt(R_IN-18,mid);
  const ts=document.createElementNS(NS,"text");
  ts.setAttribute("x",sx); ts.setAttribute("y",sy);
  ts.setAttribute("font-size","16");
  ts.setAttribute("fill",pl.color);
  ts.setAttribute("text-anchor","middle");
  ts.setAttribute("dominant-baseline","middle");
  ts.textContent=pl.sym;
  svg.appendChild(ts);
}

/* ===================== 中央互動 + 放大 ===================== */
const info=document.getElementById("info");
const DEFAULT=`
  <div class="c-idx">NO. --</div>
  <div class="c-star">27 宿</div>
  <div class="c-in">滑鼠移到任一格</div>
  <div class="hint">顯示該宿四足</div>`;

let hoveredStar=null;

function clearEffects(){
  kanaTexts.forEach(o=>{o.el.setAttribute("font-size",o.base); o.el.setAttribute("fill","#0d1117");});
  fanTexts.forEach(o=>{o.el.setAttribute("font-size",o.base); o.el.setAttribute("fill","#ffffff");});
}

function showStar(s){
  const st=STARS[s], pl=PLANETS[st.planet];
  const feetHtml=st.feet.map((v,i)=>
    `<span class="f">${v}</span> <span class="k">(${st.kana[i]})</span>`
  ).join("<br>");
  info.innerHTML=`
    <div class="c-idx">宿 NO.${String(s+1).padStart(2,"0")}</div>
    <div class="c-star">${st.cn}宿</div>
    <div class="c-in">${st.in}</div>
    <div class="c-planet" style="color:${pl.color}">主星 <span class="s">${pl.sym}</span> ${st.planet}</div>
    <div class="c-feet">${feetHtml}</div>
  `;
  info.style.background=`linear-gradient(160deg,${pl.color}38,#161b22 72%)`;

  clearEffects();
  kanaTexts.forEach(o=>{
    if(o.s===s){
      o.el.setAttribute("font-size",o.base*1.35);
      o.el.setAttribute("fill","#ffffff");   // 放大時改亮色，在深色帶上醒目
    }
  });
  fanTexts.forEach(o=>{
    if(o.s===s){ o.el.setAttribute("font-size",o.base*1.35); }
  });
}

cells.forEach(g=>{
  g.addEventListener("mouseenter",()=>{
    const s=+g.dataset.s;
    if(hoveredStar===s) return;
    hoveredStar=s;
    cells.forEach(c=>c.classList.toggle("dim", +c.dataset.s!==s));
    showStar(s);
  });
  g.addEventListener("click",()=> showStar(+g.dataset.s));
});
svg.addEventListener("mouseleave",()=>{
  hoveredStar=null;
  cells.forEach(c=>c.classList.remove("dim"));
  clearEffects();
  info.style.background="var(--panel)";
  info.innerHTML=DEFAULT;
});

/* 圖例 */
const legend=document.getElementById("legend");
Object.entries(PLANETS).forEach(([n,p])=>{
  const d=document.createElement("div");
  d.className="legend-item";
  d.innerHTML=`<span class="dot" style="background:${p.color}"></span>${p.sym} ${n}`;
  legend.appendChild(d);
});
</script>
</body>
</html>
